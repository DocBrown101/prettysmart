[package]
name = "prettysmart"
version = "0.9.2"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
wildcard_imports = "warn"
enum_glob_use = "warn"
redundant_clone = "warn"
unwrap_used = "warn"

[dependencies]
colored = "3.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tabled = { version = "0.22.0", default-features = false, features = ["ansi"] } # https://github.com/zhiburt/tabled
